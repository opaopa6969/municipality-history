name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: corretto
          cache: ${{ vars.CI_ACTIONS_CACHE_ENABLED != 'false' && 'maven' || '' }}

      - name: Build and test
        run: mvn -B verify -Dgpg.skip=true
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
